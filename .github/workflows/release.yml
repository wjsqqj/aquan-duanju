name: release

# 打 tag vX.Y.Z 触发：Windows / Android / Linux / macOS 四端构建 → 自动建 GitHub Release。
# tag 去掉 v 前缀必须等于 pubspec.yaml 的 version（+ 前的部分）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      # Android SDK + NDK 体积大，先腾磁盘。
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 NDK（cmdline-tools 手动入 PATH，setup-android@v3 会装已废弃的 tools 包）
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 构建 Go 核心（三 ABI）
        run: python scripts/build_native.py --android --ndk "$ANDROID_NDK" --version "$TAG_VERSION"

      - name: flutter build apk（分架构）
        run: |
          # 依赖从 Maven/GitHub releases 拉，偶发 504（v1.10.0 首发实证）：失败重试。
          ok=0
          for i in 1 2 3; do
            if flutter build apk --release --split-per-abi; then ok=1; break; fi
            echo "第 $i 次 apk 构建失败，30s 后重试（多为依赖下载 5xx）"
            sleep 30
          done
          if [ "$ok" != "1" ]; then echo "apk 连续构建失败"; exit 1; fi

      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/aquan-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/aquan-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/aquan-x86_64.apk
          cd dist && sha256sum *.apk > sha256-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    runs-on: windows-latest
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 安装 mingw（Go c-shared 需要）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          # GitHub release 资产偶发 504/截断（v1.10.0 首发实证）：带重试下载，
          # 按字节数校验完整性，再用 7z 解压（Expand-Archive 对超大归档报空错误）。
          $expected = 276414382
          for ($i = 1; $i -le 4; $i++) {
            Remove-Item mingw.zip -ErrorAction SilentlyContinue
            curl.exe -fL --retry 3 --retry-all-errors --retry-delay 5 -o mingw.zip $url
            if ((Test-Path mingw.zip) -and (Get-Item mingw.zip).Length -eq $expected) { break }
            $size = if (Test-Path mingw.zip) { (Get-Item mingw.zip).Length } else { 0 }
            Write-Host "mingw.zip 大小异常（$size/$expected），第 $i 次重试"
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path mingw.zip) -or (Get-Item mingw.zip).Length -ne $expected) {
            throw "mingw.zip 下载不完整，放弃构建"
          }
          7z x mingw.zip -omingw -y | Out-Null
          if (-not (Test-Path "mingw\mingw64\bin\gcc.exe")) { throw "mingw 解压后缺少 gcc.exe" }
          echo "$PWD\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # 补丁版 media_kit CMake 用 file(DOWNLOAD) 拉 mpv/ANGLE，没有重试，
      # runner 网络抖一下就整次构建失败；这里先带重试拉好放进构建目录，
      # CMake 看到同名且哈希一致的文件就不再下载。
      #
      # mpv 还要多一层：上游 shinchiro 是**每日构建且滚动删档**，
      # 固定 tag 的 7z 过一阵就 404（20260921 已失效，见 v1.4.0 首次发版失败）。
      # 所以这里每次解析 latest，校验体积/哈希后把三件套传给 CMake。
      - name: 解析并预下载 mpv 归档（上游会删档，取 latest）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64 | Out-Null
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; Accept = "application/vnd.github+json" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -match '^mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } |
            Select-Object -First 1
          if (-not $asset) { throw "未在 $($release.tag_name) 找到 mpv-dev-x86_64 归档" }
          $out = "build\windows\x64\$($asset.name)"
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o $out $asset.browser_download_url
          if ($LASTEXITCODE -ne 0) { throw "下载 $($asset.name) 失败" }
          $size = (Get-Item $out).Length
          if ($size -lt 20MB) { throw "mpv 归档体积异常：$size 字节（多半是 404 页面）" }
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          "DUANJU_MPV_FILE=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DUANJU_MPV_URL=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DUANJU_MPV_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-Item $out | Select-Object Name, Length

      - name: 预下载 ANGLE 归档
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\x64 | Out-Null
          $out = "build\windows\x64\ANGLE-v1.0.1.7z"
          curl.exe -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o $out "https://github.com/alexmercerind/flutter-windows-ANGLE-OpenGL-ES/releases/download/v1.0.1/ANGLE.7z"
          if ($LASTEXITCODE -ne 0) { throw "下载 ANGLE 失败" }
          $size = (Get-Item $out).Length
          if ($size -lt 1MB) { throw "ANGLE 归档体积异常：$size 字节（多半是 404 页面）" }
          Get-Item $out | Select-Object Name, Length

      # smtc_windows 经 cargokit 构建 Rust 原生层；runner 一般自带 rustc，
      # 没有时用 choco 补装（MSVC 工具链随 VS 已就位）。
      - name: 确保 Rust 工具链（SMTC 依赖）
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Write-Output "未检测到 Rust，开始安装…"
            choco install rustup-msvc --no-progress -y
            refreshenv
          } else {
            rustc --version
          }

      - name: 构建并打包（Go 核心 + 命令行入口 + flutter build windows + zip）
        shell: pwsh
        run: python scripts/build_windows.py --version $env:TAG_VERSION --zip

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 生成安装包（双击安装）
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DVersion=$env:TAG_VERSION" "packaging\windows\aquan.iss"
          Get-FileHash "build\aquan-windows-x64-$env:TAG_VERSION-setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  aquan-windows-x64-$env:TAG_VERSION-setup.exe" } |
            Out-File -Encoding ascii "build\aquan-windows-x64-$env:TAG_VERSION-setup.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/aquan-windows-x64-*.zip
            build/aquan-windows-x64-*.sha256
            build/aquan-windows-x64-*-setup.exe

  linux:
    runs-on: ubuntu-22.04
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libasound2-dev libpulse-dev \
            libblkid-dev liblzma-dev libjsoncpp-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 构建并打包（Go 核心 + flutter build linux + tar.gz）
        run: python3 scripts/build_linux.py --version "$TAG_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/aquan-linux-x64-*.tar.gz
            build/aquan-linux-x64-*.tar.gz.sha256
            build/aquan-duanju_*.deb
            build/aquan-duanju_*.deb.sha256

  macos:
    # 苹果桌面端：产物未做开发者签名（ad-hoc），首次打开需右键 → 打开。
    # 这一项失败时不阻塞其它平台发版。
    continue-on-error: true
    runs-on: macos-latest
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 构建并打包（Go 核心 dylib + flutter build macos + zip）
        run: python3 scripts/build_macos.py --version "$TAG_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/aquan-macos-*.zip
            build/aquan-macos-*.zip.sha256
            build/aquan-macos-*.dmg
            build/aquan-macos-*.dmg.sha256

  release:
    needs: [android, windows, linux, macos]
    # 某一端失败（尤其是 macOS）时，其余平台仍然发版。
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 打包 AI 技能
        run: |
          cd skills && zip -r ../dist/duanju-search-play-skill.zip duanju-search-play

      - name: 抽取 CHANGELOG 当前版本小节
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## " ver { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # CHANGELOG 没有对应小节时兜底。
          if [ ! -s release_notes.md ]; then
            echo "阿圈短剧 $GITHUB_REF_NAME" > release_notes.md
          fi
          cat release_notes.md

      - name: 生成 update.json（应用内更新清单）
        run: |
          python3 - <<'PY'
          import hashlib, json, os

          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          base = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/releases/download/{os.environ['GITHUB_REF_NAME']}"
          )

          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()

          assets = {}
          shas = {}

          windows = sorted(
              p for p in os.listdir('dist')
              if p.startswith('aquan-windows-x64-') and p.endswith('-setup.exe')
          )
          if windows:
              name = windows[0]
              assets['windows'] = [f"{base}/{name}"]
              shas['windows'] = sha256(os.path.join('dist', name))

          for key, name in (
              ('android-arm64-v8a', 'aquan-arm64-v8a.apk'),
              ('android-armeabi-v7a', 'aquan-armeabi-v7a.apk'),
              ('android-x86_64', 'aquan-x86_64.apk'),
          ):
              path = os.path.join('dist', name)
              if os.path.exists(path):
                  assets[key] = [f"{base}/{name}"]
                  shas[key] = sha256(path)

          changelog = ''
          if os.path.exists('release_notes.md'):
              with open('release_notes.md', encoding='utf-8') as f:
                  changelog = f.read().strip()

          manifest = {
              'version': tag,
              'changelog': changelog,
              'assets': assets,
              'sha256': shas,
          }
          with open('dist/update.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          # 同一 tag 重跑（某端失败后补发）时 Release 可能已存在：改为补传产物，
          # 避免 gh release create 因已存在直接失败。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "阿圈短剧 $GITHUB_REF_NAME" --notes-file release_notes.md $PRERELEASE
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "阿圈短剧 $GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              $PRERELEASE \
              dist/*
          fi
