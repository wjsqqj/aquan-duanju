name: release

# 打 tag vX.Y.Z 触发：双平台构建 → 自动建 GitHub Release。
# tag 去掉 v 前缀必须等于 pubspec.yaml 的 version（+ 前的部分）。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      # Android SDK + NDK 体积大，先腾磁盘。
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 与 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 构建 Go 核心（三 ABI）
        run: python scripts/build_native.py --android --ndk "$ANDROID_NDK" --version "$TAG_VERSION"

      - name: flutter build apk（分架构）
        run: flutter build apk --release --split-per-abi

      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/aquan-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/aquan-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/aquan-x86_64.apk
          cd dist && sha256sum *.apk > sha256-android.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    runs-on: windows-latest
    env:
      TAG_VERSION: ""
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 pubspec 版本一致
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          grep -q "^version: $TAG_VERSION+" pubspec.yaml || {
            echo "pubspec.yaml 的 version 与 tag $GITHUB_REF_NAME 不一致"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 安装 mingw（Go c-shared 需要）
        shell: pwsh
        run: |
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          curl.exe -sL -o mingw.zip $url
          Expand-Archive mingw.zip -DestinationPath mingw
          echo "$PWD\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # CMake 需要从 GitHub 拉 mpv/ANGLE 归档；runner 上直连即可。
      - name: 构建并打包（Go 核心 + flutter build windows + zip）
        shell: pwsh
        run: python scripts/build_windows.py --version $env:TAG_VERSION --zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/aquan-windows-x64-*.zip
            build/aquan-windows-x64-*.sha256

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 抽取 CHANGELOG 当前版本小节
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## " ver { found=1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # CHANGELOG 没有对应小节时兜底。
          if [ ! -s release_notes.md ]; then
            echo "阿圈短剧 $GITHUB_REF_NAME" > release_notes.md
          fi
          cat release_notes.md

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            --title "阿圈短剧 $GITHUB_REF_NAME" \
            --notes-file release_notes.md \
            $PRERELEASE \
            dist/*
