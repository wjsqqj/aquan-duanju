name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: native/bridge/go.sum

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: 缓存 mingw.zip（E11 加固：GitHub 资产偶发 504/截断曾致 CI 整体放弃）
        id: mingwcache
        uses: actions/cache@v4
        with:
          path: mingw.zip
          key: mingw-winlibs-16.2.0posix-r3-276414382
      - name: 安装 mingw（Go c-shared 需要）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip"
          # GitHub release 资产偶发 504/截断：缓存优先（命中即跳过下载），
          # 未命中才带重试下载 + 字节数校验；actions/cache 在 job 末尾自动回存。
          $expected = 276414382
          if ("${{ steps.mingwcache.outputs.cache-hit }}" -ne "true" -or
              -not (Test-Path mingw.zip) -or (Get-Item mingw.zip).Length -ne $expected) {
            for ($i = 1; $i -le 4; $i++) {
              Remove-Item mingw.zip -ErrorAction SilentlyContinue
              curl.exe -fL --retry 3 --retry-all-errors --retry-delay 5 -o mingw.zip $url
              if ((Test-Path mingw.zip) -and (Get-Item mingw.zip).Length -eq $expected) { break }
              $size = if (Test-Path mingw.zip) { (Get-Item mingw.zip).Length } else { 0 }
              Write-Host "mingw.zip 大小异常（$size/$expected），第 $i 次重试"
              Start-Sleep -Seconds 10
            }
            if (-not (Test-Path mingw.zip) -or (Get-Item mingw.zip).Length -ne $expected) {
              throw "mingw.zip 下载不完整，放弃构建"
            }
          } else {
            Write-Host "mingw.zip 命中缓存（$expected 字节），跳过下载"
          }
          7z x mingw.zip -omingw -y | Out-Null
          if (-not (Test-Path "mingw\mingw64\bin\gcc.exe")) { throw "mingw 解压后缺少 gcc.exe" }
          echo "$PWD\mingw\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Go vet + test（native/bridge）
        working-directory: native/bridge
        run: |
          go vet ./...
          go test ./...

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
