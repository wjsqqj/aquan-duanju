org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 注：本机代理不要写在这里（会随仓库进 CI，runner 上没有 127.0.0.1:7890）。
# 需要代理时写到用户级 ~/.gradle/gradle.properties：
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890
kotlin.incremental=false
kotlin.jvm.target.validation.mode=warning

# 依赖仓库抖动（Maven Central 429/5xx）时在单次解析内退避重试：
# 默认 3 次、初始 125ms，CI 上三连失败会在 30 秒内耗尽。这里放宽到 6 次、
# 初始 2s（2/4/8/16/32s），与 workflow 的 3 轮 apk 重试互补。
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
